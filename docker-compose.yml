services:
  postgres:
    image: postgres:16-alpine
    container_name: dh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dh_net

  backend:
    image: ghcr.io/${GHCR_OWNER}/dh-backend:${IMAGE_TAG:-latest}
    container_name: dh_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3011
      NODE_ENV: production
      # Chế độ public: tên miền người dùng mở app (Nginx Proxy Manager 10.248.137.16 →
      # <server>:FRONTEND_PORT). SSO_REDIRECT_URI bỏ trống → <FRONTEND_URL>/api/auth/sso/callback;
      # COOKIE_SECURE bỏ trống → theo http/https.
      FRONTEND_URL: ${FRONTEND_URL:-https://pkt.vienthongact.vn}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-AMS_PKT}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_AUTHORIZE_URL: ${SSO_AUTHORIZE_URL:-https://ams.vienthongact.vn/Api/Sso/Authorize}
      SSO_TOKEN_URL: ${SSO_TOKEN_URL:-https://ams.vienthongact.vn/Api/Sso/Token}
      SSO_USERINFO_URL: ${SSO_USERINFO_URL:-https://ams.vienthongact.vn/Api/Sso/UserInfo}
      SSO_REFRESH_URL: ${SSO_REFRESH_URL:-https://ams.vienthongact.vn/Api/Auth/Refresh_Token}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      AMS_API_URL: ${AMS_API_URL:-https://ams.vienthongact.vn/Api}
      AMS_SYNC_TOKEN: ${AMS_SYNC_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    # ams.vienthongact.vn có split DNS: DNS public trả IP public (115.75.191.25) mà từ
    # trong LAN không đi tới được (fetch failed) → ép dùng IP nội bộ của AMS.
    extra_hosts:
      - 'ams.vienthongact.vn:${AMS_INTERNAL_IP:-10.248.137.16}'
    # Không publish port: frontend nginx proxy /api → backend:3011 trong dh_net
    networks:
      - dh_net
    labels:
      - 'com.centurylinklabs.watchtower.scope=dh'

  frontend:
    image: ghcr.io/${GHCR_OWNER}/dh-frontend:${IMAGE_TAG:-latest}
    container_name: dh_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    networks:
      - dh_net
    labels:
      - 'com.centurylinklabs.watchtower.scope=dh'

  watchtower:
    image: containrrr/watchtower
    container_name: dh_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_SCOPE: dh
      # Docker Engine 29+ từ chối API 1.25 mặc định của watchtower
      DOCKER_API_VERSION: '1.44'
      REPO_USER: ${GHCR_OWNER}
      REPO_PASS: ${GHCR_TOKEN:-}
    networks:
      - dh_net
    labels:
      - 'com.centurylinklabs.watchtower.scope=dh'

networks:
  dh_net:
    driver: bridge

volumes:
  postgres_data:
